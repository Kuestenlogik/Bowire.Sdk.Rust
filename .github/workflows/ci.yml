name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Check (default features — stdio only)
        run: cargo check --all-targets

      - name: Check (--features http)
        run: cargo check --all-targets --features http

      - name: Tests
        run: cargo test --all-features

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Format
        run: cargo fmt --all -- --check

      # `cargo check --all-targets` type-checks the example; this runs the real
      # binary, the way the host spawns it. Piping a line in and closing stdin
      # used to produce an empty stdout now and then: run() returned at EOF
      # before the reply was written (#10). It now finishes the requests it
      # read first, so this is also the check for that. The
      # assertion is the handshake (#416) rather than just the id, because a
      # reply without protocolVersion is what made the host treat every
      # plugin built with this SDK as a legacy v1 sidecar — and nothing in
      # the suite would have noticed.
      - name: Example smoke test
        run: |
          request='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}'
          cargo build --release --example echo
          out=$(echo "$request" | ./target/release/examples/echo)
          echo "$out"
          echo "$out" | grep -q '"id":"echo-rs"'
          echo "$out" | grep -q '"protocolVersion":1'

  # Against the real host, not a test double. The two wire shapes this SDK got
  # wrong — a discover reply the host reads as "no services", a ping reply it
  # reads as malformed — were invisible to a suite that only ever talked to
  # itself. This job does what an operator does: install the published Bowire
  # CLI, install the example as a sidecar plugin, ask it to discover.
  # `bowire discover` exits 0 only when a plugin actually returned a service,
  # so the exit code is the assertion.
  e2e:
    name: e2e against Bowire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install the Bowire CLI
        run: dotnet tool install --global Kuestenlogik.Bowire.Tool

      # The zip's root carries sidecar.json next to the binary its
      # `executable` names — that is what marks the archive as a sidecar
      # plugin and what the host spawns.
      - name: Package the example as a sidecar zip
        run: |
          cargo build --release --example echo
          mkdir -p stage
          cp target/release/examples/echo stage/echo
          cp examples/echo/sidecar.json stage/
          cd stage && zip -r ../echo-rs.zip . && cd ..
          unzip -l echo-rs.zip

      - name: Install it as a plugin
        run: |
          bowire --plugin-dir "$PWD/plugins" plugin install --file echo-rs.zip
          bowire --plugin-dir "$PWD/plugins" plugin list --verbose

      - name: Discover through the real host
        run: |
          out=$(bowire --plugin-dir "$PWD/plugins" discover --url "echo-rs@http://localhost:1")
          echo "$out"
          echo "$out" | grep -q "DemoService"

      # Settings end to end (#9): the declaration reaches the Settings
      # dialog's endpoint with the options a select needs, and a value set in
      # a workspace reaches the plugin on the next call, then falls back to
      # the default once cleared. The CLI has no workspace, so this goes
      # through the workbench as well.
      - name: Settings through the real host
        run: |
          set -euo pipefail
          bowire --plugin-dir "$PWD/plugins" --no-browser --port 0 > settings-host.log 2>&1 &
          host=$!
          trap 'kill $host 2>/dev/null || true' EXIT
          banner=$(timeout 60 grep -m1 "Bowire is running at" <(tail -n +1 -f settings-host.log))
          url=$(echo "$banner" | grep -o 'http://[^ ]*' | sed 's:/*$::')
          mkdir -p "$RUNNER_TEMP/ws"
          q="workspaceId=e2e&storageRoot=$RUNNER_TEMP/ws&serverUrl=echo-rs@http://localhost:1"

          curl -sf "$url/api/protocols?$q"             | jq -e '.[] | select(.id == "echo-rs") | .settings[] | select(.key == "transform")
                     | .type == "select" and ([.options[].value] == ["none","upper","lower"])'

          echo_hi() {
            curl -sf -X POST "$url/api/invoke?$q" -H 'content-type: application/json'               -d '{"protocol":"echo-rs","service":"DemoService","method":"Echo","messages":["{\"message\":\"hi\"}"]}'               | jq -r .response
          }
          echo_hi | grep -q '"message":"hi"'
          curl -sf -X PUT "$url/api/plugins/settings/echo-rs/transform?$q"             -H 'content-type: application/json' -d '{"value":"upper"}' > /dev/null
          echo_hi | grep -q '"MESSAGE":"HI"'
          curl -sf -X PUT "$url/api/plugins/settings/echo-rs/transform?$q"             -H 'content-type: application/json' -d '{"value":null}' > /dev/null
          echo_hi | grep -q '"message":"hi"'

          # The hand-entry form the example declares (Kuestenlogik/Bowire#1003).
          # A host before 2.11 has no ManualEntry service (404): a note, not a
          # failure, until the released tool is 2.11.
          status=$(curl -s -o forms.json -w '%{http_code}' "$url/api/v1/manual-entry-forms?pageSize=200")
          if [ "$status" = "404" ]; then
            echo "manual entry: skipped, this host predates Bowire 2.11"
          else
            jq -e '.forms[] | select(.protocol == "echo-rs")
                   | [.callKinds[] | "\(.id):\(.methodType)"] == ["echo:Unary","chat:Duplex"]' forms.json
          fi

      # A duplex method end to end (#5). The CLI subcommands have no duplex
      # mode — `bowire call --stream` drives invokeStream, not openChannel —
      # so this goes through the workbench's channel endpoints, which call
      # the host's SidecarChannel exactly as the browser UI does: open, read
      # the SSE stream, send twice, close. The stream ending with
      # `event: done` is the host having received `$/channel/closed`.
      # Every wait is on a signal: the banner line that carries the bound
      # URL, and the SSE request returning when the host ends the stream.
      - name: Duplex channel through the real host
        run: |
          set -euo pipefail
          bowire --plugin-dir "$PWD/plugins" --no-browser --port 0 > host.log 2>&1 &
          host=$!
          trap 'kill $host 2>/dev/null || true' EXIT
          banner=$(timeout 60 grep -m1 "Bowire is running at" <(tail -n +1 -f host.log))
          url=$(echo "$banner" | grep -o 'http://[^ ]*' | sed 's:/*$::')
          echo "host at $url"

          open=$(curl -sf -X POST "$url/api/channel/open?serverUrl=echo-rs@http://localhost:1" \
            -H 'content-type: application/json' \
            -d '{"service":"DemoService","method":"Chat","protocol":"echo-rs"}')
          echo "$open"
          id=$(echo "$open" | jq -er .channelId)

          curl -sfN "$url/api/channel/$id/responses" > responses.txt &
          sse=$!
          for word in one two; do
            curl -sf -X POST "$url/api/channel/$id/send" -H 'content-type: application/json' \
              -d "{\"message\":\"{\\\"message\\\":\\\"$word\\\"}\"}" | jq -e '.sent == true'
          done
          curl -sf -X POST "$url/api/channel/$id/close" | jq -e '.closed == true'
          wait $sse
          cat responses.txt

          grep -q 'echoed\\":{\\"message\\":\\"one' responses.txt
          grep -q 'echoed\\":{\\"message\\":\\"two' responses.txt
          grep -q '^event: done' responses.txt
