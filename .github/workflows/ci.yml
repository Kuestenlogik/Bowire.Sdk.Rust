name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Check (default features — stdio only)
        run: cargo check --all-targets

      - name: Check (--features http)
        run: cargo check --all-targets --features http

      - name: Tests
        run: cargo test --all-features

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Format
        run: cargo fmt --all -- --check

      # `cargo check --all-targets` type-checks the example; this runs the real
      # binary, the way the host spawns it. Piping a line in and closing stdin
      # used to produce an empty stdout now and then: run() returned at EOF
      # before the reply was written (#10). It now finishes the requests it
      # read first, so this is also the check for that. The
      # assertion is the handshake (#416) rather than just the id, because a
      # reply without protocolVersion is what made the host treat every
      # plugin built with this SDK as a legacy v1 sidecar — and nothing in
      # the suite would have noticed.
      - name: Example smoke test
        run: |
          request='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}'
          cargo build --release --example echo
          out=$(echo "$request" | ./target/release/examples/echo)
          echo "$out"
          echo "$out" | grep -q '"id":"echo-rs"'
          echo "$out" | grep -q '"protocolVersion":1'

  # Against the real host, not a test double. The two wire shapes this SDK got
  # wrong — a discover reply the host reads as "no services", a ping reply it
  # reads as malformed — were invisible to a suite that only ever talked to
  # itself. This job does what an operator does: install the published Bowire
  # CLI, install the example as a sidecar plugin, and use it through the CLI
  # and the workbench — discover, settings, a server stream, a duplex channel
  # (scripts/e2e.sh). Once per transport: over stdio the host spawns the
  # sidecar; over http (#12) it runs on its own, the host POSTs to it and
  # reads its notifications off one SSE stream, and it has to stop when told
  # to while the host is still connected.
  e2e:
    name: e2e against Bowire (${{ matrix.transport }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        transport: [stdio, http]
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install the Bowire CLI
        run: dotnet tool install --global Kuestenlogik.Bowire.Tool

      - name: Build the example
        run: cargo build --release --example echo ${{ matrix.transport == 'http' && '--features http' || '' }}

      - name: Through the real host
        run: bash scripts/e2e.sh ${{ matrix.transport }} target/release/examples/echo
