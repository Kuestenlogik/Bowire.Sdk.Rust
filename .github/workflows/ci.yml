name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Check (default features — stdio only)
        run: cargo check --all-targets

      - name: Check (--features http)
        run: cargo check --all-targets --features http

      - name: Tests
        run: cargo test --all-features

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Format
        run: cargo fmt --all -- --check

      # `cargo check --all-targets` compiles the example; this runs it. The
      # assertion is the handshake (#416) rather than just the id, because a
      # reply without protocolVersion is what made the host treat every
      # plugin built with this SDK as a legacy v1 sidecar — and nothing in
      # the suite would have noticed.
      - name: Example smoke test
        run: |
          request='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}'
          out=$(echo "$request" | cargo run --quiet --example echo)
          echo "$out"
          echo "$out" | grep -q '"id":"echo-rs"'
          echo "$out" | grep -q '"protocolVersion":1'
