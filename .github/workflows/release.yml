name: Release

# Publishes the crate to crates.io when a version tag is pushed, the way
# Kuestenlogik/Bowire publishes its packages to nuget.org: through Trusted
# Publishing, so no long-lived registry key is stored anywhere. The job's
# GitHub OIDC token is exchanged for a crates.io token that lives for minutes,
# right before `cargo publish`.
#
# crates.io trusts a workflow only for a crate that already exists, so the
# very first release cannot use it. For that one release, store a crates.io
# API token (scope: publish-new) as the repository secret CARGO_REGISTRY_TOKEN;
# the job uses it while it is there. After the first publish, add this
# repository and `release.yml` as a trusted publisher in the crate's settings
# on crates.io, then delete the secret. Every later release goes through OIDC.
#
# workflow_dispatch publishes an existing tag again, e.g. one pushed before
# this workflow existed. A version already on crates.io is skipped, not an
# error, so a re-run is harmless.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The existing tag to publish, e.g. v0.2.0"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # crates.io Trusted Publishing: the OIDC token the auth action exchanges.
      id-token: write
    # Job-level env so the optional secret is visible in `if:` expressions
    # (the `secrets` context is not available there directly).
    env:
      HAS_BOOTSTRAP_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # A tag that disagrees with Cargo.toml would publish a version nobody
      # tagged; refuse it before anything leaves the runner.
      - name: The tag names the crate's version
        id: version
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "bowire-plugin") | .version')
          echo "crate version $version, tag $TAG"
          test "v$version" = "$TAG"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The same gate as CI, on exactly the commit being published.
      - name: Test
        run: |
          cargo test --all-features
          cargo clippy --all-targets --all-features -- -D warnings

      - name: Already on crates.io?
        id: published
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -A "bowire-sdk-rust-release (github.com/Kuestenlogik/Bowire.Sdk.Rust)" \
            "https://crates.io/api/v1/crates/bowire-plugin/${{ steps.version.outputs.version }}")
          echo "crates.io answered $status"
          if [ "$status" = "200" ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - name: Package
        if: steps.published.outputs.exists != 'true'
        run: cargo publish --dry-run

      # Trusted Publishing: crates.io trusts this repository's release.yml
      # (configured in the crate's settings) and hands out a short-lived
      # token for this job. Skipped while the bootstrap secret is there.
      - name: Exchange the OIDC token for a crates.io token
        id: auth
        if: steps.published.outputs.exists != 'true' && env.HAS_BOOTSTRAP_TOKEN != 'true'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish
        if: steps.published.outputs.exists != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish

      - name: Nothing to publish
        if: steps.published.outputs.exists == 'true'
        run: echo "bowire-plugin ${{ steps.version.outputs.version }} is already on crates.io"
