[package]
name = "bowire-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Rust SDK for writing Bowire protocol plugins as polyglot sidecars (JSON-RPC over stdio or HTTP/SSE)."
license = "Apache-2.0"
repository = "https://github.com/Kuestenlogik/Bowire.Sdk.Rust"
homepage = "https://bowire.io"
documentation = "https://docs.rs/bowire-plugin"
keywords = ["bowire", "sidecar", "plugin", "json-rpc"]
categories = ["api-bindings", "development-tools"]
readme = "README.md"

[features]
# Default: stdio runtime only. Opt into the HTTP/SSE variant when
# you want a hosted / multi-tenant sidecar that doesn't run as the
# host's subprocess.
default = []
http = ["dep:axum", "dep:tokio-stream"]

[dependencies]
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

# tokio drives the async loop: the plugin trait is async, so we
# need an executor regardless. Features list covers both runtimes.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-std", "io-util", "net", "signal"] }

# HTTP/SSE-mode dependencies — only pulled in by the `http` feature.
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio"], optional = true }
tokio-stream = { version = "0.1", features = ["sync"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[[example]]
name = "echo"
path = "examples/echo/main.rs"
