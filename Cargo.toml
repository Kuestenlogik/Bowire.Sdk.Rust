[package]
name = "bowire-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Rust SDK for writing Bowire protocol plugins as polyglot sidecars (JSON-RPC over stdio or HTTP/SSE)."
license = "Apache-2.0"
repository = "https://github.com/Kuestenlogik/Bowire.Sdk.Rust"
homepage = "https://bowire.io"
documentation = "https://docs.rs/bowire-plugin"
keywords = ["bowire", "sidecar", "plugin", "json-rpc"]
categories = ["api-bindings", "development-tools"]
readme = "README.md"

[features]
# Default: stdio runtime only. The HTTP/SSE runtime lands in a
# follow-up release — same contract surface, different transport.
default = []

[dependencies]
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

# tokio drives the async loop: the plugin trait is async, so we
# need an executor regardless. Minimum features the stdio runtime
# needs.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-std", "io-util"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[[example]]
name = "echo"
path = "examples/echo/main.rs"
